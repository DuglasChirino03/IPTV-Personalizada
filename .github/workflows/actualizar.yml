
name: Actualizar lista IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar lista personalizada
        run: python generar.py

      - name: Guardar lista actualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lista.m3u
          git commit -m "Actualizar lista IPTV" || echo "Sin cambios"
          git push

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivo para publicar
        uses: actions/upload-pages-artifact@v4
        with:
          path: lista.m3u

      - name: Publicar lista IPTV
        id: deployment
        uses: actions/deploy-pages@v4
        
